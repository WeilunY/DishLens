<rect x="1068" y="339" width="472" height="381" rx="10" fill="white" stroke="#DEDAD4"/>
<text x="1091" y="388" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#292724">What this does not tell you</text>
<text x="1091" y="433" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#292724">More mentions do not establish more orders,</text>
<text x="1091" y="461" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#292724">revenue, or customer demand.</text>
<text x="1091" y="543" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#706D67">Promotions, selective reviews, and missing channels</text>
<text x="1091" y="569" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#706D67">can influence the result. No statistical-significance</text>
<text x="1091" y="595" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#706D67">claim.</text>
<rect x="1091" y="650" width="258" height="40" rx="7" fill="white" stroke="#DEDAD4"/>
