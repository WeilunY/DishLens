<text x="294" y="862" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#292724">18 current mentions vs. 3 prior, across 3 current venues. Baseline too small for a growth claim.</text>
<text x="294" y="898" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#706D67">If dates, locality, or coverage cannot be verified, the agent suppresses the trend comparison.</text>
