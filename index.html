<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F2F2F6">
  <title>DishLens | Today</title>
  <style>
    :root{
      --bg:#F2F2F6;--card:#fff;--ink:#121216;--muted:#6B6B73;--faint:#9A9AA2;--line:#ECECF0;
      --maps:#2F7BF6;--dish:#FF8A00;--apps:#7C5CFF;--social:#FF2D78;--gold:#FFB400;
      --good:#138A3E;--good-bg:#E5F6EA;--bad:#D92D20;--bad-bg:#FDECEC;--flat:#55555D;--flat-bg:#EFEFF3;
      --r:24px;--shadow:0 1px 2px rgba(17,17,22,.04),0 8px 28px rgba(17,17,22,.05)
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit;cursor:pointer}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid #8DB8FF;outline-offset:2px;border-radius:12px}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

    /* Top bar + tabs */
    .topbar{position:sticky;top:0;z-index:20;background:rgba(242,242,246,.85);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px)}
    .topbar-in{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:760;font-size:19px;letter-spacing:-.3px}
    .logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#FF8A00,#FF2D78);display:grid;place-items:center;color:#fff;font-size:18px}
    .tabs{display:flex;gap:4px;background:#E5E5EA;padding:4px;border-radius:15px;margin:0 auto}
    .tabs button{border:0;background:transparent;padding:8px 14px;border-radius:11px;font-weight:620;font-size:14.5px;color:#55555D;display:flex;align-items:center;gap:7px;white-space:nowrap}
    .tabs svg{width:18px;height:18px;flex:none}
    .tabs button[aria-current=page]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .who{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:620}
    .avatar{width:36px;height:36px;border-radius:50%;background:#1D1D22;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}

    main{max-width:1120px;margin:0 auto;padding:22px 24px 40px}
    main:focus{outline:none}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:6px 0 22px;flex-wrap:wrap}
    .page-head h1{font-size:34px;letter-spacing:-.9px;margin:0;line-height:1.15}
    .page-head p{margin:6px 0 0;color:var(--muted);font-size:17px}
    .kicker{font-size:14px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
    .icon-chip{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
    .icon-chip svg{width:24px;height:24px}

    .grid{display:grid;gap:16px}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .mt{margin-top:16px}
    .card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
    .card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;flex-wrap:wrap}
    .card-title h2{font-size:19px;margin:0;letter-spacing:-.25px}
    .card-title h3{font-size:17px;margin:0}
    .label{font-size:15px;color:var(--muted);font-weight:520}
    .small{font-size:13.5px;color:var(--muted)}
    .big{font-size:50px;font-weight:760;letter-spacing:-1.8px;line-height:1.05;font-variant-numeric:tabular-nums}
    .mid{font-size:30px;font-weight:740;letter-spacing:-.9px;line-height:1.1;font-variant-numeric:tabular-nums}
    .unit{font-size:20px;color:var(--muted);font-weight:620;letter-spacing:0;margin-left:3px}
    .star{color:var(--gold)}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .between{justify-content:space-between}

    .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;font-size:13.5px;font-weight:650;white-space:nowrap;line-height:1.4}
    .pill.up{background:var(--good-bg);color:var(--good)}
    .pill.down{background:var(--bad-bg);color:var(--bad)}
    .pill.flat{background:var(--flat-bg);color:var(--flat)}
    .pill.ai{background:linear-gradient(90deg,#EFE8FF,#FFE6F1);color:#6233D6}
    .pill.warn{background:#FFF1DE;color:#A35A00}
    .pill svg{width:14px;height:14px}

    .seg{display:inline-flex;background:#EDEDF1;border-radius:13px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
    .seg::-webkit-scrollbar{display:none}
    .seg button{flex:none;white-space:nowrap;border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:620;font-size:14.5px;color:#5C5C64;min-height:38px}
    .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

    .insight{display:flex;gap:12px;align-items:flex-start;background:#F6F6F9;border-radius:18px;padding:15px 17px;font-size:16px;margin-top:18px;line-height:1.5}
    .insight .ico{font-size:22px;line-height:1.2;flex:none}
    .go{display:inline-flex;align-items:center;gap:4px;font-weight:650;font-size:15px;color:var(--maps);margin-top:14px}

    /* Summary cards on Today */
    a.card{display:block;transition:transform .15s ease,box-shadow .15s ease}
    a.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(17,17,22,.05),0 14px 34px rgba(17,17,22,.08)}
    .sum-head{display:flex;align-items:center;gap:10px;font-weight:680;font-size:16px}
    .sum-head .dotc{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}
    .sum-head .dotc svg{width:17px;height:17px}
    .sum-head .chev{margin-left:auto;color:var(--faint)}
    .mini-list{list-style:none;margin:12px 0 0;padding:0}
    .mini-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15.5px}
    .mini-list li:first-child{border-top:0}
    .mini-list .r{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}

    /* Rings */
    .rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:center}
    .ring-link{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;border-radius:20px}
    .ring-link:hover{background:#F7F7FA}
    .ring{position:relative;display:grid;place-items:center}
    .ring svg{transform:rotate(-90deg)}
    .ring .prog{animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1)}
    @keyframes ringIn{from{stroke-dashoffset:var(--c)}}
    .ring .center{position:absolute;inset:0;display:grid;place-items:center;align-content:center;line-height:1.1}
    .ring .center b{font-size:30px;letter-spacing:-.8px}
    .ring .center span{font-size:12.5px;color:var(--muted);font-weight:600}
    .ring-name{font-weight:680;font-size:16px}

    /* AI summary */
    .ai-card{background:linear-gradient(135deg,#F4EEFF 0%,#FFF0F6 100%);border-radius:var(--r);padding:22px}
    .ai-card p{margin:10px 0 0;font-size:18px;line-height:1.55}

    /* To-dos */
    .todo{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
    .todo:first-of-type{border-top:0}
    .check{width:30px;height:30px;border-radius:50%;border:2px solid #C9C9D1;background:#fff;display:grid;place-items:center;padding:0;color:#fff}
    .check[aria-pressed=true]{background:var(--good);border-color:var(--good)}
    .check svg{width:16px;height:16px}
    .todo-text{font-weight:650;font-size:16px}
    .todo.done .todo-text{text-decoration:line-through;color:var(--faint)}
    .todo a{color:var(--maps);font-weight:650;font-size:14.5px;white-space:nowrap}
    .progress{height:8px;background:#EEEEF2;border-radius:99px;overflow:hidden;margin:10px 0 6px}
    .progress span{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s ease}

    /* Line charts */
    .chart{margin-top:20px;user-select:none;-webkit-user-select:none}
    .plot{position:relative;height:var(--h,230px);margin-right:46px;touch-action:pan-y;outline:none;cursor:crosshair}
    .plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .plot .gridline{stroke:#ECECF0;stroke-width:1;vector-effect:non-scaling-stroke}
    .plot .evline{stroke:#CFCFD7;stroke-width:1.5;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
    .plot .line{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .ylab{position:absolute;left:calc(100% + 10px);transform:translateY(-50%);font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
    .xlabels{position:relative;height:22px;margin:8px 46px 0 0}
    .xlabels span{position:absolute;transform:translateX(-50%);font-size:12.5px;color:var(--faint);white-space:nowrap}
    .xlabels span:first-child{transform:none}
    .xlabels span:last-child{transform:translateX(-100%)}
    .dot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 0 0 1px var(--c),0 2px 6px rgba(0,0,0,.18);transform:translate(-50%,-50%);pointer-events:none}
    .plot.scrubbing .dot.last{opacity:0}
    .pin{position:absolute;top:-4px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-size:14px;display:grid;place-items:center}
    .scrub-line{position:absolute;top:0;bottom:0;width:1.5px;background:#BDBDC6;transform:translateX(-50%)}
    .tip{position:absolute;top:2px;transform:translateX(-50%);background:#1C1C21;color:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:2}
    .tip .d{color:#BDBDC6;font-size:12px;font-weight:600}
    .tip-row{display:flex;align-items:center;gap:7px}
    .tip-row i{width:9px;height:9px;border-radius:50%;display:inline-block}
    .chart-hint{font-size:13px;color:var(--faint);margin-top:4px}
    .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .legend button{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;font-weight:620;font-size:14.5px;min-height:38px}
    .legend button i{width:11px;height:11px;border-radius:50%;background:var(--c)}
    .legend button[aria-pressed=false]{color:var(--faint);background:#F6F6F9}
    .legend button[aria-pressed=false] i{background:#D0D0D8}

    .spark{display:block;width:100%;margin-top:14px;overflow:visible}
    .spark .line{fill:none;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}

    /* Events */
    .events{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
    .events li{display:flex;align-items:center;gap:12px;font-size:15.5px}
    .events .pin{position:static;transform:none;flex:none}
    .events .when{color:var(--muted);font-size:14px;margin-left:auto;white-space:nowrap}

    /* Star breakdown + reviews */
    .bars-h{display:grid;gap:10px;margin-top:14px}
    .bar-h{display:grid;grid-template-columns:34px 1fr 44px;gap:10px;align-items:center;font-size:14.5px;font-weight:600}
    .bar-h .t{height:12px;border-radius:99px;background:#EEEEF2;overflow:hidden}
    .bar-h .t span{display:block;height:100%;border-radius:99px;background:var(--gold)}
    .bar-h .p{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    .review{padding:14px 0;border-top:1px solid var(--line)}
    .review:first-of-type{border-top:0;padding-top:6px}
    .review p{margin:6px 0 0;font-size:15.5px}
    .stars{color:var(--gold);letter-spacing:1px}

    /* Dishes */
    .dish{padding:0;overflow:hidden}
    .dish + .dish{margin-top:14px}
    .dish-head{display:grid;grid-template-columns:60px minmax(0,1fr) auto;column-gap:16px;row-gap:2px;align-items:center;padding:18px 22px;width:100%;border:0;background:none;text-align:left}
    .dish-head .photo,.dish-head .dish-score{grid-row:1/3}
    .dish-head .photo{grid-column:1}.dish-head .dish-name-wrap{grid-column:2}.dish-head .dish-score{grid-column:3}
    .dish-senti{grid-column:2;display:block}
    .emoji{width:60px;height:60px;border-radius:18px;background:#FFF3E3;display:grid;place-items:center;font-size:32px}
    .photo{position:relative;display:grid;place-items:center;overflow:hidden;background:#FFF3E3;flex:none}
    .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .dish-head .photo{width:84px;height:84px;border-radius:20px;font-size:36px}
    .dish-head{grid-template-columns:84px minmax(0,1fr) auto!important}
    .mini-list .photo{width:40px;height:40px;border-radius:12px;font-size:20px}
    .dish-hero{height:200px;border-radius:20px;margin-bottom:6px;font-size:64px}
    .dish-name{font-size:19px;font-weight:720;letter-spacing:-.2px}
    .dish-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14.5px;margin-top:2px}
    .senti{display:flex;height:9px;border-radius:99px;overflow:hidden;gap:2px;margin-top:8px;max-width:440px}
    .senti span{display:block;height:100%}
    .senti-legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
    .senti-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
    .dish-score{text-align:right}
    .dish-score .mid{font-size:30px}
    .chev{width:22px;height:22px;color:var(--faint);transition:transform .2s;margin-left:auto;display:block}
    .dish.open .chev{transform:rotate(180deg)}
    .dish-body{border-top:1px solid var(--line);padding:22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
    .ai-box{background:linear-gradient(135deg,#F5F0FF,#FFF0F6);border-radius:20px;padding:18px 20px}
    .ai-box p{margin:10px 0 0;font-size:17px;line-height:1.55}
    .ai-note{font-size:12.5px;color:#7C6F95;margin-top:10px}
    .sub-h{font-size:16px;font-weight:720;margin:22px 0 10px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:#E7F7EC;color:#137A3A;padding:7px 13px;border-radius:999px;font-size:14.5px;font-weight:620}
    .fix{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:15px;border:1px solid var(--line);border-radius:18px;margin-top:10px;align-items:start}
    .fix .num{width:34px;height:34px;border-radius:50%;background:#1D1D22;color:#fff;display:grid;place-items:center;font-weight:700}
    .fix b{font-size:16px}
    .fix p{margin:4px 0 0;color:#4A4A52;font-size:15px}
    .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:2px}
    .tag.keep{background:var(--good-bg);color:var(--good)}
    .tag.easy{background:#E6F0FF;color:#1F5FD1}
    .tag.try{background:#F0EAFF;color:#6233D6}
    .tag.check{background:#FFF1DE;color:#A35A00}
    .quote{background:#F7F7FA;border-radius:16px;padding:13px 15px;margin-top:10px;font-size:15.5px}
    .quote .src{font-size:13px;color:var(--muted);margin-top:4px}

    /* Social */
    .daybars{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:20px}
    .daycol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;min-width:0}
    .stack{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;min-height:4px;background:#EEEEF2}
    .stack span{display:block;width:100%}
    .daycol .n{font-size:14px;font-weight:700}
    .daycol .d{font-size:13px;color:var(--muted)}
    .daycol.top .d{color:var(--ink);font-weight:700}
    .post{padding:0;overflow:hidden;display:flex;flex-direction:column}
    .thumb{height:220px;display:grid;place-items:center;font-size:72px;position:relative;overflow:hidden}
    .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
    .thumb .plat,.thumb .views{z-index:1}
    .thumb .plat{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
    .thumb .views{position:absolute;bottom:12px;left:14px;color:#fff;font-weight:760;font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px}
    .thumb .views svg{width:16px;height:16px}
    .post-body{padding:15px 17px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
    .post-body .cap{font-size:15.5px}
    .post-body .row.between{flex-wrap:nowrap}
    .post-body .row.between b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .post-body .stats{display:flex;gap:14px;color:var(--muted);font-size:14px;margin-top:auto}
    .trend-row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
    .trend-row:first-of-type{border-top:0}
    .trend-row .e{width:44px;height:44px;border-radius:14px;background:#F6F6F9;display:grid;place-items:center;font-size:22px}
    .tips{margin:12px 0 0;padding:0;list-style:none;counter-reset:tip}
    .tips li{position:relative;padding:12px 0 12px 44px;border-top:1px solid rgba(98,51,214,.12);font-size:16px}
    .tips li:first-child{border-top:0}
    .tips li::before{counter-increment:tip;content:counter(tip);position:absolute;left:0;top:11px;width:30px;height:30px;border-radius:50%;background:#fff;color:#6233D6;font-weight:760;display:grid;place-items:center;box-shadow:0 1px 3px rgba(98,51,214,.2)}
    .app-badge{width:36px;height:36px;border-radius:11px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}

    footer{max-width:1120px;margin:0 auto;padding:10px 24px 40px;color:var(--faint);font-size:13.5px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
    footer a{color:var(--muted);text-decoration:underline;margin-right:12px}
    footer button{border:0;background:#E5E5EA;border-radius:10px;padding:7px 12px;font-weight:620;font-size:13.5px}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1C21;color:#fff;padding:12px 20px;border-radius:14px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.2);font-weight:600}


    /* ---------- Icons ---------- */
    .hi{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);flex:none}
    .hi svg{width:19px;height:19px}
    .hi.sm{width:28px;height:28px;border-radius:9px}
    .hi.sm svg{width:16px;height:16px}
    .ht{display:flex;align-items:center;gap:10px}
    .sub-h{display:flex;align-items:center;gap:9px}
    .ic{display:inline-flex;vertical-align:-3px;margin-right:4px}
    .ic svg{width:16px;height:16px}
    .label .ic{color:var(--accent)}
    .tile .tico{color:var(--tc)}
    .tile .tico svg{width:22px;height:22px}
    .tag{display:inline-flex!important;align-items:center;gap:4px}
    .tag svg{width:13px;height:13px;stroke-width:2.3}
    .src-app{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;color:#fff;font-size:10px;font-weight:800;vertical-align:-4px;margin-right:4px}
    .chart-hint .ic svg{width:14px;height:14px}
    .post-body .stats .ic{margin-right:3px}
    .post-body .stats svg{width:15px;height:15px}
    .post-body .stats span:first-child .ic{color:#FF2D78}
    .thumb .plat{display:inline-flex;align-items:center;gap:5px}

  function ratingDetails(app,start,r){

    const newRev=Math.round(NEW_REVIEWS.slice(start).reduce((a,b)=>a+b,0)*list.reduce((a,x)=>a+x.weekly,0));
    const recent=list.flatMap(x=>x.recent.map(v=>({...v,app:x}))).sort((a,b)=>a.d-b.d).slice(0,app==='all'?5:4);
    const where=app==='all'?'on all apps':'on '+APPS[app].name;
    return `
    <div class="grid g3 mt">
      <div class="card tile" style="--t:#E6F0FF;--tc:#1F5FD1"><div class="tico">${ICONS.chat}</div><div class="label">New reviews</div><div class="mid" style="margin-top:6px">${newRev.toLocaleString('en-US')}</div><div class="small">${where} in ${r.words}</div></div>
      <div class="card tile" style="--t:#E3F7FF;--tc:#0B7FAE"><div class="tico">${ICONS.calendar}</div><div class="label">Reviews per week</div><div class="mid" style="margin-top:6px">${Math.round(newRev/r.n)}</div><div class="small">on average</div></div>
      <div class="card tile" style="--t:#E5F6EA;--tc:#138A3E"><div class="tico">${ICONS.smile}</div><div class="label">Happy customers</div><div class="mid" style="margin-top:6px">${split[0]+split[1]}%</div><div class="small">gave you 4 or 5 stars this month</div></div>
    </div>
    <div class="grid g2 mt">
      <section class="card"><div class="card-title"><h2 class="ht">${hi('apps','#F5A300')}Stars this month</h2><span class="small">${app==='all'?'All apps':esc(APPS[app].name)}</span></div><div class="bars-h">${split.map((p,k)=>`<div class="bar-h"><span>${5-k} <span class="star">★</span></span><div class="t"><span style="width:${p}%"></span></div><span class="p">${p}%</span></div>`).join('')}</div></section>
      <section class="card"><div class="card-title"><h2 class="ht">${hi('chat','#2F7BF6')}Newest reviews</h2><span class="small">${app==='all'?'From every app':esc(APPS[app].name)}</span></div>

    </section>
    ${ratingDetails(app,start,r)}`;
  }

  function render(focusKey){
    charts={};

    if(state.tab==='ratings'){const [a1,a2,soft,g1,g2]=APP_THEME[state.rApp];Object.entries({'--accent':a1,'--accent2':a2,'--soft':soft,'--glow1':g1,'--glow2':g2}).forEach(([k,v])=>document.body.style.setProperty(k,v));}

    renderTabs();
    wireCharts();
    document.title='DishLens | '+TABS.find(t=>t[0]===state.tab)[1];

  // Hash routes: #today, #ratings, #ratings/<app>, plus the old #maps / #apps links.
  function routeFromHash(){
    let [tab,sub]=location.hash.slice(1).split('/');
    if(tab==='maps'){tab='ratings';sub='google';}else if(tab==='apps'){tab='ratings';sub='all';}
    if(tab==='ratings'&&(sub==='all'||APPS[sub]))state.rApp=sub;
    return VIEWS[tab]?tab:'today';
  }
  function go(tab){if(location.hash.slice(1)===tab){state.tab=tab;render();window.scrollTo(0,0);}else location.hash=tab;}
  let toastTimer;
  function toast(msg){clearTimeout(toastTimer);const t=$('#toast');t.textContent=msg;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,2600);}

  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k;
    if(b.dataset.go){go(b.dataset.go);}
    else if(b.dataset.set){state[b.dataset.set]=b.dataset.val;render(k);}
    else if(b.dataset.rapp){state.rApp=b.dataset.rapp;history.replaceState(null,'','#ratings/'+state.rApp);render(b.dataset.k);if(b.classList.contains('app-card'))window.scrollTo({top:0,behavior:'smooth'});}
    else if(b.dataset.dish){state.openDish=state.openDish===b.dataset.dish?null:b.dataset.dish;render(k);}
    else if(b.dataset.app){
      const key=b.dataset.app;
      if(state.apps[key]&&Object.values(state.apps).filter(Boolean).length===1){toast('Keep at least one app on the chart.');return;}
      state.apps[key]=!state.apps[key];render(k);
    }
    else if(b.dataset.todo){
      const id=b.dataset.todo;state.todos[id]=!state.todos[id];if(!state.todos[id])delete state.todos[id];persist();render(k);
      if(state.todos[id])toast(Object.keys(state.todos).length===TODOS.length?'All done this week! 🎉':'Nice work! ✅');
    }
    else if(b.dataset.action==='reset'){state.todos={};try{localStorage.removeItem(STORE);}catch(err){}render();toast('Demo reset.');}
  });
  window.addEventListener('hashchange',()=>{state.tab=routeFromHash();render();window.scrollTo(0,0);$('#content').focus({preventScroll:true});});
  document.querySelectorAll('footer [data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',ICONS[el.dataset.icon]));
  state.tab=routeFromHash();
  render();
  </script>
</body>
</html>
